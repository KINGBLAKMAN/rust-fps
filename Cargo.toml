[package]
name = "rust-fps"
version = "6.1.0"
edition = "2021"

[dependencies]
bevy = { version = "0.16", features = ["serialize", "wav"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
arboard = { version = "3.6.1", default-features = false }

# Fast dev builds: optimize dependencies (Bevy) even in debug mode.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
