[package]
name = "rust-fps"
version = "0.3.0"
edition = "2021"

[dependencies]
bevy = { version = "0.16", features = ["serialize"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"

# Fast dev builds: optimize dependencies (Bevy) even in debug mode.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
